name: Check Dozor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: node --check internal/dozor/web/app.js
      - run: bash -n scripts/install.sh scripts/build-release.sh
      - run: python3 -m py_compile scripts/collect-licenses.py scripts/soak.py
